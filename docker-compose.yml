version: '3.8'

services:
  postgres:
    image: postgres:17.4-alpine
    container_name: flowershop-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: flowerdatabase
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flowershop:
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: Dockerfile
    image: flowershop-api
    container_name: flowershop-api-container
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: flowerdatabase
    ports:
      - "8081:8080"
    volumes:
      - ./internal/db/migrations:/app/internal/db/migrations

volumes:
  postgres_data:
